# Production CD workflow

name: Emotion Detection CD

on:
  workflow_run:
    workflows: ["Emotion Detection CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    # CD only runs when CI successfully passes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
    
      # ==========================================================
      # Configure AWS credentials using GitHub OIDC
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ==========================================================
      # Deploy to EC2 using AWS Systems Manager
      # ==========================================================
      - name: Deploy to EC2 via SSM
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/emotion-detection-mlops:latest"

          echo "Deploying image: $IMAGE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0f2bfe49f443b3ae0" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Emotion Detection production container" \
            --parameters "commands=[
              \"docker pull $IMAGE\",
              \"docker stop emotion-detection-prod || true\",
              \"docker rm emotion-detection-prod || true\",
              \"docker run -d --name emotion-detection-prod --restart unless-stopped -p 127.0.0.1:5000:5000 $IMAGE gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 2 --timeout 60 flask_app.app:app\"
            ]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          echo "Waiting for deployment command to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0f2bfe49f443b3ae0" \
            --region "$AWS_REGION"

          echo "Deployment command completed."

      # ==========================================================
      # Verify Production Deployment using AWS Systems Manager
      # ==========================================================
      - name: Verify Production Deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Running production health check..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0f2bfe49f443b3ae0" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Emotion Detection production deployment" \
            --parameters 'commands=["docker ps --filter name=emotion-detection-prod","curl --fail --max-time 10 http://localhost:5000"]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID: $COMMAND_ID"

          echo "Waiting for verification command..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0f2bfe49f443b3ae0" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0f2bfe49f443b3ae0" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "SSM Verification Status: $STATUS"

          echo "----------------------------------------"
          echo "Production verification output:"
          echo "----------------------------------------"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0f2bfe49f443b3ae0" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text

          echo "----------------------------------------"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Production verification failed."
            exit 1
          fi

          echo "✅ Production verification successful."