# Production CD workflow
name: Emotion Detection CD

on:
  workflow_run:
    workflows: ["Emotion Detection CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    # CD only runs when CI successfully passes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Configure SSH
      # ==========================================================
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Runner home: $HOME"
          echo "SSH directory check:"
          ls -la "$HOME"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key.pem"
          chmod 600 "$HOME/.ssh/ec2_key.pem"

          echo "SSH key file created successfully."
          ls -l "$HOME/.ssh/ec2_key.pem"

                    echo "Testing EC2_HOST..."
          echo "Host length: ${#EC2_HOST}"

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty"
            exit 1
          fi

          echo "Running DNS lookup..."
          getent hosts "$EC2_HOST" || echo "DNS lookup failed"

          echo "Testing port 22..."
          timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" \
            && echo "Port 22 reachable" \
            || echo "Port 22 NOT reachable"

          echo "Running ssh-keyscan..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # ==========================================================
      # Deploy to AWS EC2
      # ==========================================================
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${EC2_USERNAME}@${EC2_HOST}" << EOF

            docker pull ${DOCKERHUB_USERNAME}/emotion-detection-mlops:latest

            docker stop emotion-detection-prod || true
            docker rm emotion-detection-prod || true

            docker run -d \
              --name emotion-detection-prod \
              --restart unless-stopped \
              -p 127.0.0.1:5000:5000 \
              ${DOCKERHUB_USERNAME}/emotion-detection-mlops:latest \
              gunicorn \
              --bind 0.0.0.0:5000 \
              --workers 1 \
              --threads 2 \
              --timeout 60 \
              flask_app.app:app

          EOF

      # ==========================================================
      # Verify Deployment
      # ==========================================================
      - name: Verify Production Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          sleep 15

          ssh -i ~/.ssh/ec2_key.pem "${EC2_USERNAME}@${EC2_HOST}" \
            "docker ps --filter name=emotion-detection-prod && \
             curl --fail --max-time 10 http://localhost:5000"