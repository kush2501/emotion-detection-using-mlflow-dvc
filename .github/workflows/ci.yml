name: Emotion Detection CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout Repository
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # Setup Python
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/training.txt
            requirements/tracking.txt
            requirements/ci.txt

      # ==========================================================
      # Verify Python
      # ==========================================================
      - name: Verify Python Version
        run: python --version

      # ==========================================================
      # Upgrade pip
      # ==========================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # ==========================================================
      # Install Project Dependencies
      # ==========================================================
      - name: Install Training Requirements
        run: |
          pip install -r requirements/training.txt

      - name: Install Tracking Requirements
        run: |
          pip install -r requirements/tracking.txt

      - name: Install CI Requirements
        run: |
          pip install -r requirements/ci.txt

      # ==========================================================
      # Verify Dependency Health
      # ==========================================================
      - name: Check Dependency Conflicts
        run: |
          pip check

      - name: Verify Installed Packages
        run: |
          python -c "
          import numpy
          import pandas
          import sklearn
          import flask
          import nltk
          import mlflow
          print('All required packages imported successfully.')
          "

      # ==========================================================
      # Verify DVC Installation
      # ==========================================================
      - name: Verify DVC Installation
        run: |
          dvc version
          python -c "import dvc, pathspec; print('DVC:', dvc.__version__); print('pathspec:', pathspec.__version__)"


      # ==========================================================
      # Check Python Syntax
      # ==========================================================
      - name: Check Python Syntax
        run: |
          python -m compileall src

      # ==========================================================
      # Run DVC Pipeline
      # ==========================================================
      - name: Run DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_ACTION }}
          DAGSHUB_USERNAME: kush2501
        run: |
          echo "=========================================="
          echo "Starting DVC Pipeline..."
          echo "=========================================="

          python -m dvc repro

          echo "=========================================="
          echo "DVC Pipeline completed successfully!"
          echo "=========================================="

      # ==========================================================
      # Run Unit Tests
      # ==========================================================
      - name: Run Unit Tests
        run: |
          python -m pytest tests -v

  # ==========================================================
  # Login to Docker Hub
  # ==========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================================
      # Build Production Docker Image
      # ==========================================================
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/emotion-detection-mlops:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/emotion-detection-mlops:latest \
            .

      # ==========================================================
      # Push Production Image to Docker Hub
      # ==========================================================
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/emotion-detection-mlops:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/emotion-detection-mlops:latest

      # ==========================================================
      # Verify Docker Image
      # ==========================================================
      - name: Docker Info
        run: |
          docker version
          docker images